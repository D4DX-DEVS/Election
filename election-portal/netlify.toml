# Franchise logos, election banners, and other uploaded media served by the API.
[[redirects]]
  from   = "/uploads/*"
  to     = "https://election-app-byccp.ondigitalocean.app/uploads/:splat"
  status = 200
  force  = true

# ── SPA fallback — must be LAST ───────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
